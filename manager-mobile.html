<style>
/* ============================================================
   AI MIDDLE MANAGER — Design System  (shared/tokens.css, inlined)
   Monochrome / operational / premium. Dark + Light.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap');

:root {
  /* type */
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: var(--font-sans);
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* radius */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 11px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-full: 999px;

  /* spacing rhythm */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* semantic status (functional only) */
  --good: #34c98a;
  --good-soft: color-mix(in oklab, var(--good) 16%, transparent);
  --warn: #e8b341;
  --warn-soft: color-mix(in oklab, var(--warn) 18%, transparent);
  --crit: #f0696a;
  --crit-soft: color-mix(in oklab, var(--crit) 16%, transparent);
  --info: #6ea8fe;

  /* accent — overridable via Tweaks. Monochrome default = foreground. */
  --accent: var(--fg);
  --accent-ink: var(--bg);          /* text on accent surfaces */
  --accent-soft: color-mix(in oklab, var(--fg) 10%, transparent);

  --ease: cubic-bezier(.2,.7,.2,1);
}

/* ---------------- DARK (default) ---------------- */
:root, [data-theme="dark"] {
  --bg:        #08080a;
  --bg-2:      #0d0d10;
  --surface:   #111114;
  --surface-2: #17171b;
  --elevated:  #1c1c21;
  --hover:     rgba(255,255,255,.045);
  --active:    rgba(255,255,255,.08);

  --fg:        #f4f4f6;
  --fg-2:      #adadb6;
  --fg-3:      #74747e;
  --fg-4:      #4a4a52;

  --border:    rgba(255,255,255,.07);
  --border-2:  rgba(255,255,255,.11);
  --border-strong: rgba(255,255,255,.16);

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 16px -4px rgba(0,0,0,.5);
  --shadow-lg: 0 18px 50px -12px rgba(0,0,0,.7);
  --grid-line: rgba(255,255,255,.05);
  color-scheme: dark;
}

/* ---------------- LIGHT ---------------- */
[data-theme="light"] {
  --bg:        #f6f6f7;
  --bg-2:      #fbfbfc;
  --surface:   #ffffff;
  --surface-2: #fcfcfd;
  --elevated:  #ffffff;
  --hover:     rgba(0,0,0,.035);
  --active:    rgba(0,0,0,.06);

  --fg:        #16161a;
  --fg-2:      #5a5a64;
  --fg-3:      #8e8e98;
  --fg-4:      #b6b6be;

  --border:    rgba(0,0,0,.085);
  --border-2:  rgba(0,0,0,.12);
  --border-strong: rgba(0,0,0,.18);

  --shadow-sm: 0 1px 2px rgba(20,20,30,.06);
  --shadow-md: 0 6px 20px -6px rgba(20,20,40,.12);
  --shadow-lg: 0 24px 60px -16px rgba(20,20,50,.18);
  --grid-line: rgba(0,0,0,.05);
  color-scheme: light;
}

/* accent variants (applied to :root by Tweaks) */
[data-accent="indigo"]  { --accent:#7c7bf0; --accent-ink:#0a0a12; --accent-soft:color-mix(in oklab,#7c7bf0 16%,transparent); }
[data-accent="emerald"] { --accent:#34c98a; --accent-ink:#04130d; --accent-soft:color-mix(in oklab,#34c98a 16%,transparent); }
[data-accent="blue"]    { --accent:#5b9bff; --accent-ink:#04101f; --accent-soft:color-mix(in oklab,#5b9bff 16%,transparent); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv01","ss01";
}
::selection { background: color-mix(in oklab, var(--fg) 22%, transparent); }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------- type helpers ---------------- */
.mono { font-family: var(--font-mono); font-feature-settings: "tnum","zero"; }
.tnum { font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg-3); font-weight: 500;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -.018em; font-family: var(--font-display); }

/* ---------------- primitives ---------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

.btn {
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 13px; border-radius: var(--r-sm);
  border: 1px solid var(--border-2); background: var(--surface-2); color: var(--fg);
  cursor: pointer; white-space: nowrap; transition: background .15s var(--ease), border-color .15s var(--ease), transform .05s;
}
.btn:hover { background: var(--hover); border-color: var(--border-strong); }
.btn:active { transform: translateY(.5px); }
.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 540; }
.btn-primary:hover { background: color-mix(in oklab, var(--fg) 88%, var(--bg)); border-color: transparent; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--hover); border-color: transparent; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-icon { width: 34px; padding: 0; justify-content: center; }

.chip {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: var(--r-full);
  border: 1px solid var(--border); color: var(--fg-2); background: var(--surface-2);
  letter-spacing: .01em;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.good { color: var(--good); border-color: color-mix(in oklab,var(--good) 35%,transparent); background: var(--good-soft); }
.chip.warn { color: var(--warn); border-color: color-mix(in oklab,var(--warn) 35%,transparent); background: var(--warn-soft); }
.chip.crit { color: var(--crit); border-color: color-mix(in oklab,var(--crit) 35%,transparent); background: var(--crit-soft); }

.tag {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--fg-3);
  padding: 2px 7px; border: 1px solid var(--border); border-radius: var(--r-xs);
}

/* avatar (initials) */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border-2);
  font-family: var(--font-mono); font-weight: 500; color: var(--fg-2);
  flex: none; overflow: hidden;
}
.avatar.online { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--good); }

/* striped image placeholder */
.ph {
  position: relative; border-radius: var(--r-md); overflow: hidden;
  background:
    repeating-linear-gradient(135deg, var(--grid-line) 0 1px, transparent 1px 9px),
    var(--surface-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.ph span {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--fg-3); text-align: center; padding: 0 10px;
}

/* progress / meter */
.meter { height: 6px; border-radius: 99px; background: var(--active); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--fg); }

/* focus ring */
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* entrance */
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-up { animation: fadeUp .4s var(--ease) both; }

.grid-bg {
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ---------------- showcase page chrome ---------------- */
html, body { height: 100%; }
body { overflow-x: hidden; background:
  radial-gradient(120% 80% at 50% -10%, color-mix(in oklab, var(--fg) 5%, var(--bg)), var(--bg) 60%),
  var(--bg); }
#boot { position: fixed; inset: 0; display: grid; place-content: center; background: var(--bg); z-index: 100; transition: opacity .4s; color: var(--fg-3); font-family: var(--font-mono); font-size: 13px; }
#boot.hide { opacity: 0; pointer-events: none; }
@keyframes orbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.amm-orb { animation: orbPulse 3.4s var(--ease) infinite; }
@media (prefers-reduced-motion: reduce) { .amm-orb { animation: none; } }
.phone-stage { display: flex; gap: 56px; align-items: flex-start; padding: 0 8px; }
.phone-cap { text-align: center; margin-top: 20px; }
.row-head { width: min(1180px, 92vw); margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.row-head .ln { flex: 1; height: 1px; background: var(--border); }
</style>

<script type="text/babel">
/* AI MIDDLE MANAGER — shared UI + charts */
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Sparkline ---------- */
function Sparkline({ data, w = 72, h = 24, invert = false }) {
  const min = Math.min(...data), max = Math.max(...data);
  const nx = (i) => (i / (data.length - 1)) * w;
  const ny = (v) => h - ((v - min) / (max - min || 1)) * (h - 3) - 1.5;
  const dpath = data.map((v, i) => `${i ? 'L' : 'M'}${nx(i).toFixed(1)} ${ny(v).toFixed(1)}`).join(' ');
  const last = data[data.length - 1];
  const good = invert ? last <= data[0] : last >= data[0];
  const col = good ? 'var(--good)' : 'var(--crit)';
  return (
    <svg width={w} height={h} style={{ display: 'block', overflow: 'visible' }}>
      <path d={`${dpath} L${w} ${h} L0 ${h} Z`} fill={col} opacity="0.08" />
      <path d={dpath} fill="none" stroke={col} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={nx(data.length - 1)} cy={ny(last)} r="2.2" fill={col} />
    </svg>
  );
}

/* ---------- Delta pill ---------- */
function Delta({ value, dir, invert }) {
  const positive = invert ? dir === 'down' : dir === 'up';
  const col = positive ? 'var(--good)' : 'var(--crit)';
  const Arrow = dir === 'up' ? I.up : I.down;
  return (
    <span className="mono" style={{ display: 'inline-flex', alignItems: 'center', gap: 2, fontSize: 11.5, color: col, fontWeight: 500 }}>
      <Arrow size={12} sw={2.2} /> {value}
    </span>
  );
}

/* ---------- Ring gauge ---------- */
function Ring({ value, size = 132, stroke = 9, label, sub, color = 'var(--accent)' }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c - (value / 100) * c;
  const acc = color === 'var(--accent)'
    ? (value >= 90 ? 'var(--good)' : value >= 75 ? 'var(--warn)' : 'var(--crit)') : color;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--active)" strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={acc} strokeWidth={stroke}
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 1s var(--ease)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeContent: 'center', textAlign: 'center' }}>
        <div className="mono tnum" style={{ fontSize: size * .26, fontWeight: 600, letterSpacing: '-.02em' }}>{value}</div>
        {label && <div className="eyebrow" style={{ marginTop: 2 }}>{label}</div>}
      </div>
    </div>
  );
}

/* ---------- Multi-line chart ---------- */
function LineChart({ series, labels, h = 200, yMax = 100, yMin = 0, fmt = (v)=>v }) {
  const pad = { l: 30, r: 8, t: 12, b: 22 };
  const ref = useRef(null);
  const [w, setW] = useState(560);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(([e]) => setW(e.contentRect.width));
    ro.observe(ref.current); return () => ro.disconnect();
  }, []);
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const nx = (i) => pad.l + (i / (labels.length - 1)) * iw;
  const ny = (v) => pad.t + ih - ((v - yMin) / (yMax - yMin)) * ih;
  const ticks = 4;
  return (
    <div ref={ref} style={{ width: '100%' }}>
      <svg width={w} height={h}>
        {Array.from({ length: ticks + 1 }).map((_, i) => {
          const v = yMin + (i / ticks) * (yMax - yMin);
          const y = ny(v);
          return (
            <g key={i}>
              <line x1={pad.l} x2={w - pad.r} y1={y} y2={y} stroke="var(--border)" strokeDasharray="2 4" />
              <text x={pad.l - 7} y={y + 3} textAnchor="end" className="mono" fontSize="9.5" fill="var(--fg-3)">{fmt(Math.round(v))}</text>
            </g>
          );
        })}
        {labels.map((l, i) => (i % 2 === 0) && (
          <text key={i} x={nx(i)} y={h - 6} textAnchor="middle" className="mono" fontSize="9.5" fill="var(--fg-3)">{l}</text>
        ))}
        {series.map((s, si) => {
          const dp = s.data.map((v, i) => `${i ? 'L' : 'M'}${nx(i).toFixed(1)} ${ny(v).toFixed(1)}`).join(' ');
          return (
            <g key={si}>
              {s.fill && <path d={`${dp} L${nx(s.data.length-1)} ${ny(yMin)} L${nx(0)} ${ny(yMin)} Z`} fill={s.color} opacity="0.07" />}
              <path d={dp} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              <circle cx={nx(s.data.length - 1)} cy={ny(s.data[s.data.length - 1])} r="3" fill={s.color} />
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ---------- Horizontal bars ---------- */
function HBars({ rows, max = 100, fmt = (v) => v + '%' }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
      {rows.map((r, i) => (
        <div key={i} style={{ display: 'grid', gridTemplateColumns: '150px 1fr 46px', alignItems: 'center', gap: 12 }}>
          <div style={{ fontSize: 12.5, color: 'var(--fg-2)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.label}</div>
          <div className="meter" style={{ height: 8 }}>
            <i style={{ width: `${(r.value / max) * 100}%`, background: r.color || 'var(--fg)' }} />
          </div>
          <div className="mono tnum" style={{ fontSize: 12, textAlign: 'right', color: 'var(--fg)' }}>{fmt(r.value)}</div>
        </div>
      ))}
    </div>
  );
}

/* ---------- Vertical bar chart ---------- */
function VBars({ data, labels, h = 150, color = 'var(--fg)', fmt = (v)=>v }) {
  const max = Math.max(...data) * 1.15;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: h }}>
      {data.map((v, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
          <div style={{ width: '100%', height: `${(v / max) * 100}%`, background: color, borderRadius: '4px 4px 2px 2px', minHeight: 3, opacity: i === data.length-1 ? 1 : .42, transition: 'height .6s var(--ease)' }} />
          <div className="mono" style={{ fontSize: 9, color: 'var(--fg-3)' }}>{labels[i]}</div>
        </div>
      ))}
    </div>
  );
}

/* ---------- Section header ---------- */
function SectionTitle({ eyebrow, title, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 16, gap: 16, flexWrap: 'wrap' }}>
      <div>
        {eyebrow && <div className="eyebrow" style={{ marginBottom: 6 }}>{eyebrow}</div>}
        <h2 style={{ fontSize: 19 }}>{title}</h2>
      </div>
      {children}
    </div>
  );
}

/* ---------- Avatar ---------- */
function Av({ initials, size = 34, online }) {
  return (
    <span className={'avatar' + (online ? ' online' : '')} style={{ width: size, height: size, fontSize: size * .36 }}>
      {initials}
    </span>
  );
}

/* ---------- Score badge by value ---------- */
function scoreColor(v) { return v >= 90 ? 'var(--good)' : v >= 75 ? 'var(--warn)' : 'var(--crit)'; }

Object.assign(window, { Sparkline, Delta, Ring, LineChart, HBars, VBars, SectionTitle, Av, scoreColor });
</script>

};
const MVQUAL = { strong: { c: 'var(--good)', l: 'strong' }, partial: { c: 'var(--warn)', l: 'partial' }, weak: { c: 'var(--crit)', l: 'weak' } };

function VCallRowM({ c, onClick }) {
  const r = MREADY[c.readiness];
  return (
    <button onClick={onClick} className="card" style={{ padding: '12px 13px', display: 'flex', alignItems: 'center', gap: 11, textAlign: 'left', width: '100%', cursor: 'pointer', background: 'var(--surface)', borderLeft: `2px solid ${r.c}` }}>
      <Av initials={c.initials} size={34} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.emp}</span>
          <span style={{ flex: 1 }} />
          <span className="mono" style={{ fontSize: 9.5, color: 'var(--fg-3)' }}>{c.when}</span>
        </div>
        <div className="mono" style={{ fontSize: 10, color: 'var(--fg-3)', marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.sop}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 6 }}>
          <span className="chip" style={{ height: 17, fontSize: 9, color: r.c, borderColor: `color-mix(in oklab,${r.c} 35%,transparent)` }}><span className="dot" />{r.short}</span>
          <span className="mono tnum" style={{ fontSize: 10, color: 'var(--fg-3)' }}>K {c.knowledge} · C {c.confidence}</span>
        </div>
      </div>
      <I.arrow size={15} style={{ color: 'var(--fg-4)', flex: 'none' }} />
    </button>
  );
}

function VerifyM({ onBack, onOpen }) {
  const calls = window.AMM.verificationCalls;
  const v = window.AMM.verification;
  return (
    <MScreen>
      <MAppBar title="Verification Calls" right={onBack ? <button onClick={onBack} className="mono" style={{ background: 'none', border: 'none', color: 'var(--fg-2)', fontSize: 12 }}>Done</button> : null} />
      <div style={{ paddingTop: 16, paddingBottom: 110 }}>
        <div className="card" style={{ padding: '12px 14px', display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: 14, background: 'var(--surface-2)' }}>
          <div style={{ width: 26, height: 26, flex: 'none', borderRadius: 8, background: 'var(--fg)', color: 'var(--bg)', display: 'grid', placeContent: 'center' }}><I.mic size={14} /></div>
          <p style={{ margin: 0, fontSize: 12, lineHeight: 1.45, color: 'var(--fg-2)' }}>The AI calls each employee for a live verbal check before they work solo.</p>
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          {[['Calls today', v.callsToday, 'var(--fg)'], ['Ready', v.readyRate + '%', 'var(--good)'], ['Retrain', v.notReady, 'var(--crit)']].map(([l, val, c]) => (
            <div key={l} className="card" style={{ flex: 1, padding: '11px 8px', textAlign: 'center' }}>
              <div className="mono tnum" style={{ fontSize: 19, fontWeight: 600, color: c }}>{val}</div>
              <div className="eyebrow" style={{ fontSize: 8.5, marginTop: 2 }}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
          {calls.map((c) => <VCallRowM key={c.id} c={c} onClick={() => onOpen(c)} />)}
        </div>
      </div>
    </MScreen>
  );
}

function VCallDetailM({ c, onBack }) {
  const r = MREADY[c.readiness];
  const turns = c.id === 'bianca' ? window.AMM.verificationScript.turns : null;
  return (
    <MScreen>
      <MAppBar title="Verification call" right={onBack ? <button onClick={onBack} className="mono" style={{ background: 'none', border: 'none', color: 'var(--fg-2)', fontSize: 12 }}>Done</button> : null} />
      <div style={{ paddingTop: 14, paddingBottom: 30 }}>
        {/* header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 14 }}>
          <Av initials={c.initials} size={40} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 560 }}>{c.emp}</div>
            <div className="mono" style={{ fontSize: 10.5, color: 'var(--fg-3)' }}>{c.sop} · {c.dur}</div>
          </div>
          <span className="chip" style={{ height: 24, color: r.c, borderColor: `color-mix(in oklab,${r.c} 40%,transparent)`, background: `color-mix(in oklab,${r.c} 12%,transparent)` }}><span className="dot" />{r.short}</span>
        </div>

        {/* recording player */}
        <div className="card" style={{ padding: '10px 13px', display: 'flex', alignItems: 'center', gap: 11, marginBottom: 14, background: 'var(--surface-2)' }}>
          <button style={{ width: 32, height: 32, flex: 'none', borderRadius: 99, border: 'none', background: 'var(--fg)', color: 'var(--bg)', display: 'grid', placeContent: 'center', cursor: 'pointer' }}><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg></button>
          <div style={{ flex: 1, display: 'flex', gap: 2, alignItems: 'center', height: 26 }}>
            {Array.from({ length: 38 }).map((_, i) => <span key={i} style={{ flex: 1, minWidth: 1.5, borderRadius: 2, height: `${20 + Math.abs(Math.sin(i)) * 60}%`, background: i < 13 ? 'var(--fg)' : 'var(--border-strong)' }} />)}
          </div>
          <span className="mono" style={{ fontSize: 10, color: 'var(--fg-3)' }}>{c.dur}</span>
        </div>

        {/* scores */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8, marginBottom: 14 }}>
          {[['Knowledge', c.knowledge + '%', scoreColor(c.knowledge)], ['Confidence', c.confidence + '%', scoreColor(c.confidence)], ['Readiness', r.short, r.c]].map(([l, val, col]) => (
            <div key={l} className="card" style={{ padding: 12, textAlign: 'center' }}>
              <div className="mono tnum" style={{ fontSize: l === 'Readiness' ? 12 : 18, fontWeight: 600, color: col, marginTop: l === 'Readiness' ? 4 : 0 }}>{val}</div>
              <div className="eyebrow" style={{ fontSize: 8, marginTop: 4 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* AI assessment */}
        <div className="card" style={{ padding: 14, marginBottom: 14, background: 'var(--surface-2)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 8 }}>
            <I.spark size={13} style={{ color: 'var(--fg-2)' }} />
            <span className="eyebrow" style={{ fontSize: 9 }}>AI assessment</span>
          </div>
          <p style={{ margin: '0 0 10px', fontSize: 12.5, lineHeight: 1.5, color: 'var(--fg-2)', textWrap: 'pretty' }}>{c.summary}</p>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {c.flags.map((f, i) => <span key={i} className="chip" style={{ height: 22, fontSize: 10, color: (f.includes('alert') || f.includes('Failed') || f.includes('twice')) ? 'var(--crit)' : 'var(--fg-2)' }}>{f}</span>)}
          </div>
        </div>

        {/* improvement */}
        <div className="card" style={{ padding: 14, marginBottom: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 11 }}>
            <span className="eyebrow" style={{ fontSize: 9 }}>Improvement · knowledge</span>
            <Delta value={Math.abs(c.trend[c.trend.length - 1] - c.trend[0]) + ' pts'} dir={c.trend[c.trend.length - 1] >= c.trend[0] ? 'up' : 'down'} />
          </div>
          <VBars data={c.trend} labels={['4w', '3w', '2w', 'now']} h={76} color={scoreColor(c.knowledge)} />
        </div>

        {/* transcript */}
        {turns && (
          <div style={{ marginBottom: 14 }}>
            <div className="eyebrow" style={{ fontSize: 9, marginBottom: 10 }}>Transcript · AI annotations</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {turns.map((t, i) => {
                if (t.who === 'ai') return (
                  <div key={i} style={{ fontSize: 12.5, lineHeight: 1.45, color: 'var(--fg)' }}>
                    {t.kind && t.kind !== 'verdict' && <span className="mono" style={{ display: 'block', fontSize: 8.5, color: (t.kind === 'coach' || t.kind === 'challenge') ? 'var(--warn)' : 'var(--good)', marginBottom: 3, letterSpacing: '.04em' }}>{t.kind === 'coach' ? '◆ COACHING' : t.kind === 'challenge' ? '◆ CHALLENGING' : '◆ ADVANCING'}</span>}
                    <div style={{ padding: '8px 11px', borderRadius: '4px 12px 12px 12px', background: 'var(--surface-2)', border: '1px solid var(--border)' }}>{t.t}</div>
                  </div>
                );
                const ql = MVQUAL[t.quality] || MVQUAL.partial;
                return (
                  <div key={i} style={{ alignSelf: 'flex-end', maxWidth: '84%' }}>
                    <div style={{ fontSize: 12.5, lineHeight: 1.4, color: 'var(--bg)', background: 'var(--fg)', padding: '8px 11px', borderRadius: '12px 4px 12px 12px' }}>{t.t}</div>
                    <div style={{ display: 'flex', gap: 7, justifyContent: 'flex-end', marginTop: 4 }}>
                      {t.hesitation && <span className="mono" style={{ fontSize: 8.5, color: 'var(--warn)' }}>hesitation</span>}
                      <span className="mono" style={{ fontSize: 8.5, color: ql.c }}>{ql.l}</span>
                      <span className="mono tnum" style={{ fontSize: 8.5, color: 'var(--fg-3)' }}>{Math.round(t.confidence * 100)}%</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* action */}
        {c.readiness === 'ready'
          ? <div className="chip good" style={{ height: 38, width: '100%', justifyContent: 'center', boxSizing: 'border-box' }}><I.check size={14} sw={2.4} /> Cleared to work independently{c.follow ? ` · ${c.follow}-day follow-up` : ''}</div>
          : <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ flex: 1, height: 46, borderRadius: 12, border: 'none', background: 'var(--fg)', color: 'var(--bg)', fontSize: 13.5, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, cursor: 'pointer' }}><I.send size={15} /> Send retraining</button>
              <button style={{ width: 110, height: 46, borderRadius: 12, border: '1px solid var(--border-2)', background: 'var(--surface-2)', color: 'var(--fg)', fontSize: 13, cursor: 'pointer' }}>Re-call</button>
            </div>}
      </div>
    </MScreen>
  );
}

/* ───────── interactive manager phone ───────── */
function ManagerApp() {
  const [tab, setTab] = useState('home');
  const [esc, setEsc] = useState(null);
  const [vcall, setVcall] = useState(null);
  const [verifyOpen, setVerifyOpen] = useState(false);
  if (esc) return (
    <div style={{ position: 'absolute', inset: 0 }}><EscDetailM e={esc} onBack={() => setEsc(null)} /></div>
  );
  if (vcall) return (
    <div style={{ position: 'absolute', inset: 0 }}><VCallDetailM c={vcall} onBack={() => setVcall(null)} /></div>
  );
  if (verifyOpen) return (
    <div style={{ position: 'absolute', inset: 0 }}><VerifyM onBack={() => setVerifyOpen(false)} onOpen={(c) => { setVerifyOpen(false); setVcall(c); }} /></div>
  );
  const screens = {
    home: <HomeM setTab={setTab} openEsc={setEsc} openVerify={() => setVerifyOpen(true)} openVCall={setVcall} />,
    alerts: <AlertsM openEsc={setEsc} />,
    sites: <SitesM />,
    team: <TeamM />,
    ask: <AskM answered={false} />,
  };
  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      {screens[tab]}
      <MTabBar tab={tab} setTab={setTab} />
    </div>
  );
}

Object.assign(window, { ManagerApp, EscDetailM, AskM, VerifyM, VCallDetailM });
</script>

<!-- ════════════ SHOWCASE ROOT ════════════ -->
<script type="text/babel">
  function Phone({ children, dark = true }) {
    return (
      <div style={{ width: 390, height: 844, flex: 'none' }}>
        <IOSDevice dark={dark} width={390} height={844}>
          <div style={{ position: 'absolute', inset: 0, top: 50 }}>{children}</div>
        </IOSDevice>
      </div>
    );
  }
  function ThemeToggle({ theme, setTheme }) {
    return (
      <div style={{ display: 'flex', gap: 4, padding: 3, background: 'var(--surface-2)', borderRadius: 9, border: '1px solid var(--border)' }}>
        {[['dark', 'moon'], ['light', 'sun']].map(([k, ic]) => {
          const Ico = I[ic]; const active = theme === k;
          return (
            <button key={k} onClick={() => setTheme(k)} className="btn btn-sm" style={{ height: 28, textTransform: 'capitalize', border: 'none', background: active ? 'var(--active)' : 'transparent', color: active ? 'var(--fg)' : 'var(--fg-3)' }}><Ico size={14} /> {k}</button>
          );
        })}
      </div>
    );
  }
  function ScaledRow({ scale, children }) {
    const ref = React.useRef(null);
    const [mb, setMb] = React.useState(0);
    React.useLayoutEffect(() => { if (ref.current) setMb(-(ref.current.offsetHeight * (1 - scale))); }, [scale]);
    return <div ref={ref} className="phone-stage" style={{ transform: `scale(${scale})`, transformOrigin: 'top center', marginBottom: mb }}>{children}</div>;
  }
  function Caption({ k, title, sub }) {
    return (
      <div className="phone-cap" style={{ width: 390 }}>
        <div className="mono" style={{ fontSize: 10.5, color: 'var(--fg-4)', letterSpacing: '.08em' }}>{k}</div>
        <div style={{ fontSize: 14, fontWeight: 560, marginTop: 5 }}>{title}</div>
        <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 3 }}>{sub}</div>
      </div>
    );
  }
  function ManagerShowcase() {
    const [scale, setScale] = React.useState(1);
    const [theme, setThemeState] = React.useState(() => localStorage.getItem('amm-mobile-theme') || 'dark');
    const dark = theme === 'dark';
    const setTheme = (t) => { setThemeState(t); localStorage.setItem('amm-mobile-theme', t); };
    React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
    React.useEffect(() => {
      function fit() {
        const wScale = (window.innerWidth - 120) / (390 * 3 + 56 * 2);
        setScale(Math.max(0.5, Math.min(1, wScale)));
      }
      fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
    }, []);
    const crit = window.AMM.escalations[0];
    const vReady = window.AMM.verificationCalls.find((c) => c.id === 'bianca');
    const vNotReady = window.AMM.verificationCalls.find((c) => c.readiness === 'not-ready');
    return (
      <div style={{ minHeight: '100vh', padding: '48px 0 64px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div style={{ width: 'min(1180px, 92vw)', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 20, marginBottom: 40, flexWrap: 'wrap' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 14 }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: 'var(--fg)', color: 'var(--bg)', display: 'grid', placeContent: 'center' }}><I.logo size={18} /></div>
              <span className="mono" style={{ fontSize: 12, color: 'var(--fg-3)', letterSpacing: '.04em' }}>AI MIDDLE MANAGER</span>
            </div>
            <h1 style={{ fontSize: 34, letterSpacing: '-.025em' }}>Command center in your pocket</h1>
            <p style={{ fontSize: 15, color: 'var(--fg-2)', marginTop: 10, maxWidth: 560, lineHeight: 1.5 }}>
              Supervise every location from the floor. The AI briefs you, surfaces what needs attention, and lets you approve escalations or ask anything — without opening a laptop.
            </p>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            <ThemeToggle theme={theme} setTheme={setTheme} />
            <a href="mobile.html" className="btn" style={{ textDecoration: 'none' }}><I.phone size={15} /> Employee app</a>
            <a href="index.html" className="btn" style={{ textDecoration: 'none' }}><I.grid size={15} /> Desktop dashboard</a>
          </div>
        </div>

        <ScaledRow scale={scale}>
          <div>
            <Phone dark={dark}><ManagerApp /></Phone>
            <Caption k="01 · INTERACTIVE" title="Overview" sub="Tap the tab bar — Overview, Alerts, Sites, Team, Ask" />
          </div>
          <div>
            <Phone dark={dark}><EscDetailM e={crit} /></Phone>
            <Caption k="02 · ESCALATION" title="Approve on the go" sub="AI summary, evidence & a one-tap recommended action" />
          </div>
          <div>
            <Phone dark={dark}><AskM answered={true} /></Phone>
            <Caption k="03 · AI MANAGER" title="Ask anything" sub="Conversational answers with next-step actions" />
          </div>
        </ScaledRow>

        {/* AI Knowledge Verification on mobile */}
        <div className="row-head" style={{ margin: '60px auto 8px' }}>
          <span className="chip" style={{ height: 24, color: 'var(--fg)', borderColor: 'var(--border-strong)' }}><I.mic size={12} /> New</span>
          <span className="mono" style={{ fontSize: 12, color: 'var(--fg-3)', letterSpacing: '.04em' }}>AI KNOWLEDGE VERIFICATION CALLS</span>
          <span className="ln" />
        </div>
        <div className="row-head" style={{ marginBottom: 34, display: 'block' }}>
          <h2 style={{ fontSize: 24, letterSpacing: '-.02em' }}>Verify competency from your phone</h2>
          <p style={{ fontSize: 14, color: 'var(--fg-2)', marginTop: 8, maxWidth: 620, lineHeight: 1.5 }}>
            Review the AI's verbal verification calls anywhere — knowledge & confidence scores, annotated transcripts, SOP readiness, and who's been flagged for retraining.
          </p>
        </div>
        <ScaledRow scale={scale}>
          <div>
            <Phone dark={dark}><VerifyM /></Phone>
            <Caption k="04 · VERIFICATION" title="Every verbal check" sub="Ready rate, confidence & who needs retraining" />
          </div>
          <div>
            <Phone dark={dark}><VCallDetailM c={vReady} /></Phone>
            <Caption k="05 · CALL DETAIL" title="Scores & transcript" sub="Readiness, AI annotations & improvement" />
          </div>
          <div>
            <Phone dark={dark}><VCallDetailM c={vNotReady} /></Phone>
            <Caption k="06 · FLAGGED" title="Not ready → retrain" sub="One tap to send retraining or re-call" />
          </div>
        </ScaledRow>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<ManagerShowcase />);
</script>
<script>
  (function () {
    var t = setInterval(function () {
      var r = document.getElementById('root');
      if (r && r.children.length) { document.getElementById('boot').classList.add('hide'); clearInterval(t); }
    }, 120);
    setTimeout(function () { clearInterval(t); }, 12000);
  })();
</script>
</body>
