<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Middle Manager — Manager on Mobile (Print)</title>
<link rel="stylesheet" href="../shared/tokens.css" />
<style>
  html, body { height: 100%; }
  body { background: #fff; margin: 0; }
  #boot { position: fixed; inset: 0; display: grid; place-content: center; background: var(--bg); z-index: 100; color: var(--fg-3); font-family: var(--font-mono); font-size: 13px; }
  #boot.hide { display: none; }
  .amm-orb { /* frozen for print */ }

  .print-page {
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 0 36px;
  }
  .print-head {
    width: min(720px, 92vw);
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .phone-cap { text-align: center; margin-top: 22px; }

  @page { size: portrait; margin: 12mm; }

  @media print {
    html, body { background: #fff !important; }
    #boot { display: none !important; }
    /* force on-screen colors/backgrounds to render */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    /* one phone per page */
    .print-page { break-after: page; break-inside: avoid; min-height: auto; height: auto; padding: 0; justify-content: flex-start; }
    .print-page:last-child { break-after: auto; }
    /* freeze all animations at their end state */
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>
<div id="boot">Preparing print layout…</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>document.documentElement.setAttribute('data-theme', 'light');</script>
<script src="../desktop/data.js"></script>
<script type="text/babel" src="../desktop/icons.jsx"></script>
<script type="text/babel" src="../desktop/ui.jsx"></script>
<script type="text/babel" src="../mobile/ios-frame.jsx"></script>
<script type="text/babel" src="../mobile/manager.jsx"></script>
<script type="text/babel">
  function Phone({ children }) {
    return (
      <div style={{ width: 390, height: 844, flex: 'none' }}>
        <IOSDevice dark={false} width={390} height={844}>
          <div style={{ position: 'absolute', inset: 0, top: 50 }}>{children}</div>
        </IOSDevice>
      </div>
    );
  }
  function Caption({ k, title, sub }) {
    return (
      <div className="phone-cap" style={{ width: 390 }}>
        <div className="mono" style={{ fontSize: 10.5, color: 'var(--fg-4)', letterSpacing: '.08em' }}>{k}</div>
        <div style={{ fontSize: 14, fontWeight: 560, marginTop: 5 }}>{title}</div>
        <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 3 }}>{sub}</div>
      </div>
    );
  }
  function PageHead() {
    return (
      <div className="print-head">
        <div style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--fg)', color: 'var(--bg)', display: 'grid', placeContent: 'center' }}><I.logo size={16} /></div>
        <span className="mono" style={{ fontSize: 11, color: 'var(--fg-3)', letterSpacing: '.05em' }}>AI MIDDLE MANAGER · MANAGER ON MOBILE</span>
      </div>
    );
  }
  function PrintShowcase() {
    const crit = window.AMM.escalations[0];
    const pages = [
      { node: <ManagerApp />,            k: '01 · OVERVIEW',   title: 'Operations briefing', sub: 'AI summary, live ops & location health at a glance' },
      { node: <EscDetailM e={crit} />,   k: '02 · ESCALATION', title: 'Approve on the go',   sub: 'AI summary, evidence & a one-tap recommended action' },
      { node: <AskM answered={true} />,  k: '03 · AI MANAGER', title: 'Ask anything',        sub: 'Conversational answers with next-step actions' },
    ];
    return (
      <div>
        {pages.map((p, i) => (
          <div className="print-page" key={i}>
            <PageHead />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
              <Phone>{p.node}</Phone>
              <Caption k={p.k} title={p.title} sub={p.sub} />
            </div>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<PrintShowcase />);
</script>
<script type="text/babel">
  // hide boot, then auto-print once render + fonts are ready
  (function () {
    function ready() {
      var r = document.getElementById('root');
      return r && r.children.length;
    }
    var t = setInterval(function () {
      if (ready()) {
        clearInterval(t);
        document.getElementById('boot').classList.add('hide');
        var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
        fonts.then(function () { setTimeout(function () { window.print(); }, 600); });
      }
    }, 150);
    setTimeout(function () { clearInterval(t); }, 12000);
  })();
</script>
</body>
</html>
