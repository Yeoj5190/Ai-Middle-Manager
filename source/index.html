<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Middle Manager — Operations Platform</title>
<link rel="stylesheet" href="shared/tokens.css" />
<style>
  #root { min-height: 100vh; }
  /* boot splash */
  #boot { position: fixed; inset: 0; display: grid; place-content: center; background: var(--bg); z-index: 100; transition: opacity .4s; }
  #boot.hide { opacity: 0; pointer-events: none; }
  input::placeholder { color: var(--fg-4); }
  kbd { font-family: var(--font-mono); }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="22" fill="#08080a"/><g stroke="#f4f4f6" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="30" width="32" height="40" rx="7"/><path d="M42 44l8 8 8-8v16"/></g></svg>
</template>
<div id="boot">
  <div style="display:flex;align-items:center;gap:12px;color:var(--fg-3);font-family:var(--font-mono);font-size:13px;">
    <div style="width:30px;height:30px;border-radius:9px;background:var(--fg);display:grid;place-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#08080a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 16V9l4 4 4-4v7"/></svg>
    </div>
    Loading operations…
  </div>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="desktop/data.js"></script>
<script type="text/babel" src="desktop/icons.jsx"></script>
<script type="text/babel" src="desktop/ui.jsx"></script>
<script type="text/babel" src="desktop/shell.jsx"></script>
<script type="text/babel" src="desktop/dashboard.jsx"></script>
<script type="text/babel" src="desktop/employees.jsx"></script>
<script type="text/babel" src="desktop/escalations.jsx"></script>
<script type="text/babel" src="desktop/tasks.jsx"></script>
<script type="text/babel" src="desktop/quality.jsx"></script>
<script type="text/babel" src="desktop/conversations.jsx"></script>
<script type="text/babel" src="desktop/verifications.jsx"></script>
<script type="text/babel" src="desktop/sops.jsx"></script>
<script type="text/babel" src="desktop/analytics.jsx"></script>
<script type="text/babel" src="desktop/tweaks-panel.jsx"></script>
<script type="text/babel" src="desktop/app.jsx"></script>
<script>
  // hide boot splash once React has mounted (poll — render may already be done)
  (function () {
    function check() {
      var root = document.getElementById('root');
      if (root && root.children.length) {
        document.getElementById('boot').classList.add('hide');
        return true;
      }
      return false;
    }
    var t = setInterval(function () { if (check()) clearInterval(t); }, 120);
    setTimeout(function () { clearInterval(t); }, 12000);
  })();
</script>
</body>
</html>
